# Install alongside nginx.conf to retain the existing IP API for older clients.
server {
    listen 80;
    server_name api.qiqc-op.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 308 https://api.qiqc-op.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api.qiqc-op.com;
    ssl_certificate /etc/letsencrypt/live/qop-api/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qop-api/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 16m;

    location = /mcp {
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 90s;
    }
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 90s;
    }
    location = / {
        return 302 /api/v1/status;
    }
    location / {
        return 404;
    }
}
