# IP certificate obtained separately with Certbot's webroot authenticator.
server {
    listen 80;
    server_name 43.160.217.208;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 308 https://43.160.217.208$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name 43.160.217.208;
    ssl_certificate /etc/letsencrypt/live/qop-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qop-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 16m;

    location /api/v1/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Replace any supplied forwarding chain: only this proxy is trusted.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 90s;
    }
    location = / {
        return 302 https://qiqc-op.com/;
    }
    location / {
        return 404;
    }
}
