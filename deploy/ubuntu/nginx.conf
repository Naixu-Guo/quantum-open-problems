# IP certificate obtained separately with Certbot's webroot authenticator.
limit_req_zone $binary_remote_addr zone=qop_api_ip:10m rate=10r/s;
server {
    listen 80;
    server_name 43.160.217.208;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 308 https://43.160.217.208$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name 43.160.217.208;
    ssl_certificate /etc/letsencrypt/live/qop-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qop-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 16m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    proxy_hide_header X-Content-Type-Options;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json application/x-ndjson;

    location /api/v1/ {
        limit_req zone=qop_api_ip burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Replace any supplied forwarding chain: only this proxy is trusted.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 90s;
    }
    location = / {
        return 302 https://qiqc-op.com/;
    }
    location / {
        return 404;
    }
}
