# Example separate virtual host. Replace the domain/certificate paths as needed.
# Provision the certificate before enabling this HTTPS server block.
server {
    listen 443 ssl;
    server_name research.qiqc-op.com;
    ssl_certificate /etc/letsencrypt/live/qop-research/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qop-research/privkey.pem;
    client_max_body_size 1m;

    # Forward the entire origin: OAuth discovery/callbacks are not under /mcp.
    location / {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
