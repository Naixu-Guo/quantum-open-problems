name: Monitor proposal inbox capacity

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inbox-capacity-notifications
  cancel-in-progress: false

jobs:
  capacity:
    if: github.repository == 'Naixu-Guo/quantum-open-problems'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      QOP_INBOX_MONITOR_KEY: ${{ secrets.QOP_INBOX_MONITOR_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Check capacity and notify the owner
        if: env.QOP_INBOX_MONITOR_KEY != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          QOP_INBOX_ALERT_ASSIGNEE: Naixu-Guo
        run: node scripts/check-inbox-capacity.mjs
      - name: Explain missing configuration
        if: env.QOP_INBOX_MONITOR_KEY == ''
        run: echo 'Capacity notifications are disabled until QOP_INBOX_MONITOR_KEY is configured.'
