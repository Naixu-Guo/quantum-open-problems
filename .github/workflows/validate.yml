name: Validate problem records

on:
  pull_request:
    paths:
      - "database/**"
      - "site/**"
      - "scripts/**"
      - ".github/workflows/validate.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository with full history
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Build and validate every record
        run: node site/build.mjs --out "${RUNNER_TEMP}/qiqcop-dist"
