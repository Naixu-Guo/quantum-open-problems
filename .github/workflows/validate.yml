name: Validate catalog contribution

on:
  push:
    branches: [main]
    paths:
      - "contract/**"
      - "service/**"
      - "mcp/**"
      - "ledger/**"
      - "activity/**"
      - "tools/**"
      - "catalog/**"
      - "docs/adr/**"
      - "open_prob/**"
      - "open_problem_v2/**"
      - "site/**"
      - "mcp/**"
      - "package.json"
      - "CONTRIBUTING.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/workflows/validate.yml"

  pull_request:
    paths:
      - "contract/**"
      - "service/**"
      - "ledger/**"
      - "activity/**"
      - "tools/**"
      - "catalog/**"
      - "docs/adr/**"
      - "open_prob/**"
      - "open_problem_v2/**"
      - "site/**"
      - "mcp/**"
      - "package.json"
      - "CONTRIBUTING.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/workflows/validate.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Build and validate catalog
        run: node site/build.mjs

      - name: Check generated files
        run: git diff --exit-code -- catalog site

  contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contract
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: contract/package-lock.json

      - name: Install
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Validate fixture ledger
        run: npm run validate

      - name: Validate seed ledger
        run: node --experimental-strip-types --no-warnings src/cli/validate.ts ../ledger ../activity

      - name: Test
        run: npm test

  service:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: contract/package-lock.json

      - name: Install contract dependencies
        run: npm ci
        working-directory: contract

      - name: Type-check the service
        run: npm run typecheck
        working-directory: service

      - name: Test the service
        run: npm test
        working-directory: service

      - name: Type-check the MCP adapter
        run: npm run typecheck
        working-directory: mcp

      - name: Test the MCP adapter
        run: npm test
        working-directory: mcp
