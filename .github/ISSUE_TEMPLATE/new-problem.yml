name: Propose a new problem
description: Propose a sourced, self-contained open problem for the zoo.
title: "[New problem] "
body:
  - type: input
    id: problem_title
    attributes:
      label: Problem title
      description: A short descriptive title, as it would appear in \section{...}.
    validations:
      required: true

  - type: textarea
    id: statement
    attributes:
      label: Problem statement
      description: Self-contained, with the definitions and quantifiers needed. TeX is welcome; number every displayed equation.
    validations:
      required: true

  - type: dropdown
    id: status
    attributes:
      label: Status
      options:
        - Unsolved
        - Partially solved
        - Solved
    validations:
      required: true

  - type: textarea
    id: source
    attributes:
      label: Source
      description: The paper or preprint that posed the problem, or the papers in which it is implicit. Write "Contributor: Name" if it has no literature source.
    validations:
      required: true

  - type: textarea
    id: progress
    attributes:
      label: Known progress
      description: One to three accurately scoped results, each with its source and one sentence on why it falls short of the full question.
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: References
      description: Full bibliographic entries with DOI and arXiv links.
    validations:
      required: true

  - type: input
    id: tags
    attributes:
      label: Tags
      description: One to six canonical names from database/tags.json, separated by semicolons.
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Proposal checks
      options:
        - label: I searched the zoo for duplicates and equivalent formulations.
          required: true
        - label: I opened and checked every cited source.
          required: true
        - label: The statement is self-contained and has a checkable resolution criterion.
          required: true
