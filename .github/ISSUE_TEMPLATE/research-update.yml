name: Research update (candidate update)
description: Submit a result, computation, correction, failed route, or literature update for an existing problem. Editors enter it into the service as a candidate update on your behalf.
title: "[Research update] "
body:
  - type: markdown
    attributes:
      value: |
        This form mirrors the candidate-update contract (`/api/v1/candidate-update.schema.json`). If you have an actor key, submit through `POST /api/v1/candidate-updates` or the MCP tool `submit_candidate_update` instead. Every field maps to a schema property.

  - type: input
    id: problem_id
    attributes:
      label: Problem ID
      description: Copy the stable record ID from the problem page or frontier.
      placeholder: horodecki-2020-npt-bound-entanglement
    validations:
      required: true

  - type: input
    id: statement_id
    attributes:
      label: Statement version ID
      description: From the frontier (`statement.id`), e.g. `<problem-id>-statement-v1`.
    validations:
      required: true

  - type: input
    id: target_clause_ids
    attributes:
      label: Target clause IDs
      description: Comma-separated clause IDs from the frontier that the claim addresses.
    validations:
      required: true

  - type: input
    id: record_revision
    attributes:
      label: Record revision and statement digest
      description: The SHA-256 digests you worked from, from the research brief or JSON record.
    validations:
      required: true

  - type: dropdown
    id: update_kind
    attributes:
      label: Update kind
      options:
        - proof
        - counterexample
        - partial-theorem
        - improved-bound
        - computation
        - numerical-evidence
        - experiment
        - failed-approach
        - source-correction
        - status-review
        - literature-update
        - other
    validations:
      required: true

  - type: input
    id: title
    attributes:
      label: Title
    validations:
      required: true

  - type: textarea
    id: claim
    attributes:
      label: Exact claim
      description: State the theorem, counterexample, computation, or correction with its hypotheses and quantifiers.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Which part of the formal statement the claim addresses and whether the result is full or partial.
    validations:
      required: true

  - type: textarea
    id: sources
    attributes:
      label: Primary sources
      description: One per line with theorem, page, equation, or version locators.
    validations:
      required: true

  - type: textarea
    id: artifacts
    attributes:
      label: Argument and reproducible artifacts
      description: Proof outline and links to code, data, proof files, logs, or certificates (with digests when possible).
    validations:
      required: true

  - type: dropdown
    id: relation
    attributes:
      label: Proposed relation to the target clause
      options:
        - supports
        - narrows
        - refutes
        - resolves
        - reformulates
        - rules-out
        - status-review
    validations:
      required: true

  - type: dropdown
    id: status_change
    attributes:
      label: Proposed status change
      description: A proposal only; editors decide.
      options:
        - none
        - open
        - partial
        - solved
    validations:
      required: true

  - type: textarea
    id: remaining_gap
    attributes:
      label: Remaining gap
      description: What remains unresolved if reviewers accept this update.
    validations:
      required: true

  - type: dropdown
    id: ai_level
    attributes:
      label: AI involvement
      options:
        - none
        - assisted
        - agent-generated
    validations:
      required: true

  - type: textarea
    id: ai_systems
    attributes:
      label: AI systems and human checks
      description: Name the models or agents, their operator, and the checks a person performed. Write "None" for human-only work.
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I opened and checked the cited sources.
          required: true
        - label: I compared the claim with the cataloged statement version and its target clauses.
          required: true
        - label: I labeled conditional, numerical, and conjectural steps as such.
          required: true
