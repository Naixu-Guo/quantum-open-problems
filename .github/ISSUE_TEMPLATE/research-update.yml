name: Report progress or a correction
description: Submit a result, correction, or status change for an existing problem.
title: "[Update] "
body:
  - type: input
    id: record_id
    attributes:
      label: Problem ID
      description: The stable ID shown under the title of the problem page.
      placeholder: op_43d4aca67bd52554
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: Type of update
      options:
        - Complete proof or counterexample
        - Partial result
        - Numerical or computational evidence
        - Status or source correction
        - Wording or reference fix
    validations:
      required: true

  - type: textarea
    id: claim
    attributes:
      label: Exact claim
      description: State the theorem, counterexample, or correction with its hypotheses and quantifiers, and how it matches the archived statement.
    validations:
      required: true

  - type: textarea
    id: sources
    attributes:
      label: Primary sources
      description: Links with theorem, page, or equation locators. Mark preprints and conditional steps as such.
    validations:
      required: true

  - type: textarea
    id: remaining_gap
    attributes:
      label: Remaining gap
      description: What stays unresolved if this update is accepted.
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I opened and checked the cited sources.
          required: true
        - label: I compared the claim with the archived statement and its quantifiers.
          required: true
