<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quantum Open Problems</title>
  <meta name="description" content="A ledger of well-defined open problems in quantum science, read and written by people and agents.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <link rel="alternate" type="application/json" href="/api/v1/status" title="Service status">
  <script>
    // Apply the saved theme before first paint so the page does not flash.
    try { const t = localStorage.getItem("qop-theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
    window.MathJax = {
      tex: { inlineMath: [["$", "$"], ["\\(", "\\)"]], displayMath: [["$$", "$$"], ["\\[", "\\]"]], processEscapes: true, tags: "ams" },
      options: { skipHtmlTags: ["script", "noscript", "style", "textarea", "pre", "code"], ignoreHtmlClass: "no-math" },
      startup: {
        typeset: false,
        // The typeset methods exist once defaultReady has run; the page waits for this event, not for an initial typeset.
        ready() { MathJax.startup.defaultReady(); window.dispatchEvent(new Event("mathjax-ready")); },
      },
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@4.1.3/tex-svg.js" defer></script>
</head>

    <span>Quantum Open Problems is a ledger kept in Git; the pages here are views of it.</span>
    <nav aria-label="Footer">
      <a href="/about">About</a>
      <a href="/api/v1/status">API</a>
      <a href="https://github.com/Naixu-Guo/quantum-open-problems" rel="noopener">Repository</a>
    </nav>
  </footer>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="/app.js"></script>
</body>
